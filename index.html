<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>扫雷 · Minesweeper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
<style>
  :root{
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --radius: 16px;
  }
  /* ---------- 深色主题（默认） ---------- */
  body[data-theme="dark"]{
    --bg-1:#0d1220; --bg-2:#16203a; --bg-3:#0a0e1a;
    --panel: rgba(255,255,255,.055);
    --panel-border: rgba(255,255,255,.09);
    --text:#e9edf6; --text-dim:#8a94ab;
    --cell-hi:#33436b; --cell-lo:#232f52;
    --cell-hover:#3c4d7a;
    --cell-flat:#1a2440;
    --cell-flat-border:rgba(0,0,0,.25);
    --bevel-light:rgba(255,255,255,.10);
    --bevel-dark:rgba(0,0,0,.45);
    --accent:#ffb648;
    --danger:#ff5d5d;
    --shadow: 0 20px 50px rgba(0,0,0,.5);
    --pill: rgba(255,255,255,.07);
  }
  /* ---------- 浅色主题 ---------- */
  body[data-theme="light"]{
    --bg-1:#e8edf8; --bg-2:#f6f8ff; --bg-3:#dde5f4;
    --panel: rgba(255,255,255,.75);
    --panel-border: rgba(30,45,80,.10);
    --text:#1d2740; --text-dim:#68738d;
    --cell-hi:#ffffff; --cell-lo:#d7e0f0;
    --cell-hover:#e9effc;
    --cell-flat:#eaeff9;
    --cell-flat-border:rgba(40,60,100,.08);
    --bevel-light:rgba(255,255,255,.95);
    --bevel-dark:rgba(90,110,150,.35);
    --accent:#e8930c;
    --danger:#e5484d;
    --shadow: 0 20px 45px rgba(60,80,130,.25);
    --pill: rgba(255,255,255,.85);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    color:var(--text);
    background:
      radial-gradient(1000px 600px at 85% -10%, var(--bg-2), transparent 60%),
      radial-gradient(800px 500px at -10% 110%, var(--bg-3), transparent 55%),
      var(--bg-1);
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 14px 40px;
    -webkit-tap-highlight-color:transparent;
    transition:background .4s ease;
    overflow-x:hidden;
  }

  .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; align-items:center; gap:16px; }

  /* ---------- 标题 ---------- */
  .title{
    display:flex; align-items:center; gap:12px;
    font-size:clamp(22px, 4vw, 30px); font-weight:800; letter-spacing:1px;
    user-select:none;
  }
  .title .bomb{ font-size:1.15em; filter:drop-shadow(0 4px 10px rgba(255,182,72,.35)); }
  .title em{
    font-style:normal;
    background:linear-gradient(100deg, var(--accent), #ff8a5c);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .title .sub{ font-size:.42em; font-weight:600; color:var(--text-dim); letter-spacing:4px; align-self:flex-end; margin-bottom:6px; }

  /* ---------- 控制栏 ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    transition:background .4s ease;
  }
  .controls{ display:flex; align-items:center; gap:8px; padding:10px 12px; flex-wrap:wrap; justify-content:center; }
  .pills{ display:flex; gap:4px; background:var(--pill); border-radius:12px; padding:4px; }
  .pill{
    border:none; cursor:pointer; font-family:var(--font);
    font-size:13.5px; font-weight:600; color:var(--text-dim);
    padding:7px 16px; border-radius:9px; background:transparent;
    transition:all .2s ease; white-space:nowrap;
  }
  .pill:hover{ color:var(--text); }
  .pill.active{
    color:#fff; background:linear-gradient(120deg, #ff9f43, #ff6b6b);
    box-shadow:0 4px 12px rgba(255,120,80,.35);
  }
  body[data-theme="light"] .pill.active{ color:#fff; }
  .icon-btn{
    width:38px; height:38px; border-radius:11px; border:1px solid var(--panel-border);
    background:var(--pill); cursor:pointer; font-size:17px;
    display:grid; place-items:center; transition:all .2s ease; color:var(--text);
  }
  .icon-btn:hover{ transform:translateY(-1px); }
  .icon-btn.active{ background:linear-gradient(120deg,#ff9f43,#ff6b6b); border-color:transparent; box-shadow:0 4px 12px rgba(255,120,80,.35); }

  /* 自定义难度面板 */
  .custom-panel{ display:none; padding:12px 16px 14px; border-top:1px solid var(--panel-border); }
  .custom-panel.show{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .custom-panel label{ font-size:13px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  .custom-panel input{
    width:64px; padding:6px 8px; border-radius:8px; border:1px solid var(--panel-border);
    background:var(--pill); color:var(--text); font-family:var(--font); font-size:14px; text-align:center; outline:none;
  }
  .custom-panel input:focus{ border-color:var(--accent); }
  .apply-btn{
    border:none; cursor:pointer; font-family:var(--font); font-weight:700; font-size:13.5px;
    padding:8px 18px; border-radius:10px; color:#fff;
    background:linear-gradient(120deg,#ff9f43,#ff6b6b); box-shadow:0 4px 12px rgba(255,120,80,.35);
  }

  /* ---------- 状态栏 ---------- */
  .statusbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; width:100%; }
  .led{
    display:flex; align-items:center; gap:8px;
    font-variant-numeric:tabular-nums; font-weight:800; font-size:clamp(18px,3vw,23px);
    background:rgba(0,0,0,.28); border-radius:12px; padding:7px 14px; min-width:96px; justify-content:center;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.35); color:#ffe9c7; letter-spacing:1px;
  }
  body[data-theme="light"] .led{ background:rgba(20,30,60,.88); }
  .face{
    width:52px; height:52px; border-radius:16px; border:none; cursor:pointer;
    font-size:26px; display:grid; place-items:center;
    background:linear-gradient(145deg, var(--cell-hi), var(--cell-lo));
    box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 1px 0 var(--bevel-light);
    transition:transform .15s ease;
  }
  .face:hover{ transform:scale(1.06); }
  .face:active{ transform:scale(.95); }

  /* ---------- 雷区 ---------- */
  .board-wrap{ padding:12px; width:100%; overflow:auto; }
  .board{
    display:grid; gap:3px; margin:0 auto; width:max-content;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  .board.shake{ animation:shake .55s ease; }
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    15%{ transform:translate(-7px,3px); } 30%{ transform:translate(6px,-4px); }
    45%{ transform:translate(-5px,-3px); } 60%{ transform:translate(5px,4px); }
    75%{ transform:translate(-3px,2px); } 90%{ transform:translate(2px,-2px); }
  }
  .cell{
    width:var(--cell); height:var(--cell);
    border-radius:max(4px, calc(var(--cell) * .16));
    background:linear-gradient(145deg, var(--cell-hi), var(--cell-lo));
    box-shadow:0 2px 4px var(--bevel-dark), inset 0 1px 0 var(--bevel-light);
    display:grid; place-items:center;
    font-weight:800; font-size:calc(var(--cell) * .52);
    cursor:pointer; position:relative;
    transition:background .12s ease, transform .08s ease;
  }
  body[data-theme="dark"] .cell{ color:#dfe6f5; }
  .cell:not(.revealed):hover{ background:var(--cell-hover); }
  .cell:not(.revealed):active{ transform:scale(.92); }
  .cell.revealed{
    background:var(--cell-flat);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.18);
    cursor:default; border:1px solid var(--cell-flat-border);
  }
  .cell.revealed.pop{ animation:pop .22s ease backwards; }
  @keyframes pop{ from{ transform:scale(.6); opacity:.2; } to{ transform:scale(1); opacity:1; } }
  .cell .flag{ animation:flagIn .18s ease; line-height:1; font-size:calc(var(--cell) * .55); }
  @keyframes flagIn{ from{ transform:scale(.3) rotate(-25deg); } to{ transform:scale(1) rotate(0); } }

  /* 数字配色（经典方案微调） */
  .n1{ color:#4d8dff !important; } .n2{ color:#34c77b !important; } .n3{ color:#ff5d5d !important; }
  .n4{ color:#b47aff !important; } .n5{ color:#ffab4d !important; } .n6{ color:#3fd6d6 !important; }
  .n7{ color:#e8ecf5 !important; } .n8{ color:#9aa5b8 !important; }
  body[data-theme="light"] .n7{ color:#5a657d !important; } body[data-theme="light"] .n8{ color:#98a2b5 !important; }

  .cell.mine{ background:rgba(255,93,93,.14); }
  .cell.mine .m-emoji{ line-height:1; font-size:calc(var(--cell) * .55); animation:pop .25s ease backwards; }
  .cell.boom{
    background:var(--danger) !important;
    animation:boomPulse .8s ease infinite alternate;
  }
  @keyframes boomPulse{ from{ box-shadow:0 0 0 0 rgba(255,93,93,.7);} to{ box-shadow:0 0 0 12px rgba(255,93,93,0);} }
  .cell .wrong{ position:absolute; inset:0; display:grid; place-items:center; font-size:calc(var(--cell)*.5); line-height:1; }

  /* ---------- 底部信息 ---------- */
  .footer{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:13px; color:var(--text-dim); align-items:center; }
  .footer b{ color:var(--text); font-variant-numeric:tabular-nums; }
  .hint{ text-align:center; font-size:12.5px; color:var(--text-dim); line-height:1.9; }
  .hint kbd{
    background:var(--pill); border:1px solid var(--panel-border); border-radius:5px;
    padding:1px 6px; font-size:11px; font-family:var(--font);
  }

  /* ---------- 结算弹窗 ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(8,10,20,.55);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:none; place-items:center; z-index:50; padding:16px;
  }
  .overlay.show{ display:grid; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal{
    background:var(--bg-2); border:1px solid var(--panel-border);
    border-radius:22px; padding:30px 34px; text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    animation:slideUp .35s cubic-bezier(.2,.9,.3,1.2);
    max-width:92vw;
  }
  @keyframes slideUp{ from{ transform:translateY(28px) scale(.94); opacity:0; } to{ transform:none; opacity:1; } }
  .modal .big{ font-size:52px; line-height:1; }
  .modal h2{ font-size:24px; margin:12px 0 4px; }
  .modal p{ color:var(--text-dim); font-size:14px; margin-bottom:6px; }
  .modal .record{ color:var(--accent); font-weight:800; font-size:15px; margin:4px 0 2px; }
  .modal .btns{ display:flex; gap:10px; justify-content:center; margin-top:20px; }
  .modal button{
    border:none; cursor:pointer; font-family:var(--font); font-weight:700; font-size:14.5px;
    padding:11px 24px; border-radius:12px; transition:transform .15s ease;
  }
  .modal button:hover{ transform:translateY(-2px); }
  .btn-primary{ background:linear-gradient(120deg,#ff9f43,#ff6b6b); color:#fff; box-shadow:0 6px 16px rgba(255,120,80,.4); }
  .btn-ghost{ background:var(--pill); color:var(--text); border:1px solid var(--panel-border) !important; }

  /* ---------- 彩带 ---------- */
  .confetti{
    position:fixed; top:-20px; z-index:60; pointer-events:none;
    width:10px; height:14px; border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(720deg); opacity:.7; }
  }

  @media (max-width:560px){
    body{ padding:16px 8px 30px; }
    .statusbar{ padding:10px 12px; }
    .led{ min-width:78px; font-size:17px; }
    .face{ width:46px; height:46px; font-size:22px; }
    .pill{ padding:7px 12px; font-size:12.5px; }
  }
</style>
</head>
<body data-theme="dark">
<div class="wrap">

  <div class="title">
    <span class="bomb">💣</span>
    <span><em>扫雷</em> <span class="sub">MINESWEEPER</span></span>
  </div>

  <!-- 难度 + 开关 -->
  <div class="panel">
    <div class="controls">
      <div class="pills" id="diffPills">
        <button class="pill active" data-diff="beginner">初级 9×9</button>
        <button class="pill" data-diff="intermediate">中级 16×16</button>
        <button class="pill" data-diff="expert">高级 30×16</button>
        <button class="pill" data-diff="custom">自定义</button>
      </div>
      <button class="icon-btn" id="flagModeBtn" title="插旗模式（点击翻开 ⇄ 插旗），适合触屏">🚩</button>
      <button class="icon-btn" id="soundBtn" title="音效开关">🔊</button>
      <button class="icon-btn" id="themeBtn" title="主题切换">🌙</button>
    </div>
    <div class="custom-panel" id="customPanel">
      <label>行 <input type="number" id="cRows" min="5" max="24" value="12"></label>
      <label>列 <input type="number" id="cCols" min="5" max="30" value="18"></label>
      <label>雷数 <input type="number" id="cMines" min="1" max="200" value="40"></label>
      <button class="apply-btn" id="applyCustom">开始</button>
    </div>
  </div>

  <!-- 计分 + 状态 -->
  <div class="panel statusbar">
    <div class="led" title="剩余雷数">🚩 <span id="mineCount">010</span></div>
    <button class="face" id="faceBtn" title="重新开始 (R)">🙂</button>
    <div class="led" title="用时（秒）">⏱ <span id="timeCount">000</span></div>
  </div>

  <!-- 雷区 -->
  <div class="panel board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>

  <div class="footer">
    <span>难度 <b id="diffLabel">初级 9×9</b></span>
    <span>·</span>
    <span>本机最佳 <b id="bestLabel">--</b></span>
  </div>

  <div class="hint">
    <kbd>左键</kbd> 翻开　<kbd>右键</kbd> / <kbd>长按</kbd> 插旗　<kbd>双击</kbd> 或 <kbd>中键</kbd> 快开数字　<kbd>R</kbd> 重开
  </div>
</div>

<!-- 结算弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="big" id="mIcon">😎</div>
    <h2 id="mTitle">胜利！</h2>
    <div class="record" id="mRecord" style="display:none">🏆 新纪录！</div>
    <p id="mInfo">用时 45 秒 · 初级 9×9 · 10 雷</p>
    <p id="mBest">本机最佳：--</p>
    <div class="btns">
      <button class="btn-primary" id="mRestart">再来一局</button>
      <button class="btn-ghost" id="mClose">关闭</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= 基础状态 ================= */
const DIFFS = {
  beginner:     { rows: 9,  cols: 9,  mines: 10, label: "初级 9×9"   },
  intermediate: { rows: 16, cols: 16, mines: 40, label: "中级 16×16" },
  expert:       { rows: 16, cols: 30, mines: 99, label: "高级 30×16" },
};
const $ = id => document.getElementById(id);
const boardEl = $("board");

let curDiff = "beginner";
let rows, cols, mines;
let grid = [];            // { mine, adj, revealed, flagged, el }
let started = false, over = false;
let revealedCount = 0, flagCount = 0;
let time = 0, timerId = null;
let flagMode = false, suppressClick = false, pressing = false;

/* ================= 音效（Web Audio，无外部资源） ================= */
let actx = null, soundOn = JSON.parse(localStorage.getItem("ms.sound") ?? "true");
function ensureAudio(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }
function beep(freq, dur = .08, type = "sine", vol = .12, slide = 0){
  if(!soundOn || !actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
}
function playBoom(){
  if(!soundOn || !actx) return;
  const dur = .7, sr = actx.sampleRate, buf = actx.createBuffer(1, sr * dur, sr);
  const d = buf.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(900, actx.currentTime);
  f.frequency.exponentialRampToValueAtTime(90, actx.currentTime + dur);
  const g = actx.createGain(); g.gain.value = .5;
  src.connect(f).connect(g).connect(actx.destination); src.start();
}
function playWin(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .16, "triangle", .14), i * 110)); }
const sReveal  = () => beep(620, .05, "sine", .08, 880);
const sFlag    = () => beep(920, .06, "triangle", .1);
const sUnflag  = () => beep(520, .06, "triangle", .08);

/* ================= 工具 ================= */
const idx = (x, y) => y * cols + x;
const inBoard = (x, y) => x >= 0 && x < cols && y >= 0 && y < rows;
function neighbors(x, y){
  const out = [];
  for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){
    if(dx === 0 && dy === 0) continue;
    if(inBoard(x + dx, y + dy)) out.push([x + dx, y + dy]);
  }
  return out;
}
const pad3 = n => {
  const neg = n < 0; n = Math.min(Math.abs(n), 999);
  return (neg ? "-" : "") + String(n).padStart(neg ? 2 : 3, "0");
};

/* ================= 新局 ================= */
function newGame(r, c, m){
  rows = r; cols = c; mines = m;
  grid = []; started = false; over = false;
  revealedCount = 0; flagCount = 0;
  stopTimer(); time = 0;
  $("timeCount").textContent = pad3(0);
  $("mineCount").textContent = pad3(mines);
  $("faceBtn").textContent = "🙂";
  $("overlay").classList.remove("show");
  $("diffLabel").textContent = diffLabel();
  updateBestLabel();

  // 根据视口自适应格子尺寸
  fitBoardSize();
  boardEl.innerHTML = "";

  for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){
    const el = document.createElement("div");
    el.className = "cell";
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", `第${y + 1}行 第${x + 1}列`);
    el.dataset.x = x; el.dataset.y = y;
    boardEl.appendChild(el);
    grid.push({ mine: false, adj: 0, revealed: false, flagged: false, el });
  }
}
function diffLabel(){
  if(curDiff !== "custom") return DIFFS[curDiff].label;
  return `自定义 ${cols}×${rows}`;
}
function bestKey(){ return `ms.best.${rows}x${cols}x${mines}`; }
function getBest(){ return +(localStorage.getItem(bestKey()) || 0); }
function updateBestLabel(){
  const b = getBest();
  $("bestLabel").textContent = b ? b + " 秒" : "--";
}

/* ================= 布雷（首击安全） ================= */
function placeMines(sx, sy){
  const excluded = new Set([idx(sx, sy)]);
  for(const [nx, ny] of neighbors(sx, sy)) excluded.add(idx(nx, ny));
  let pool = [];
  for(let i = 0; i < rows * cols; i++) if(!excluded.has(i)) pool.push(i);
  if(pool.length < mines){ pool = []; for(let i = 0; i < rows * cols; i++) pool.push(i); }
  // 洗牌取前 mines 个
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  for(let i = 0; i < mines; i++) grid[pool[i]].mine = true;
  // 计算周围雷数
  for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){
    grid[idx(x, y)].adj = neighbors(x, y).filter(([nx, ny]) => grid[idx(nx, ny)].mine).length;
  }
}

/* ================= 计时 ================= */
function startTimer(){
  timerId = setInterval(() => {
    time = Math.min(time + 1, 999);
    $("timeCount").textContent = pad3(time);
  }, 1000);
}
function stopTimer(){ clearInterval(timerId); timerId = null; }

/* ================= 翻开 ================= */
function reveal(x, y){
  if(over) return;
  const cell = grid[idx(x, y)];
  if(cell.revealed || cell.flagged) return;
  if(!started){ placeMines(x, y); started = true; startTimer(); }

  if(cell.mine){ explode(x, y); return; }

  // BFS 泛洪展开，记录顺序用于波浪动画
  const order = [];
  const queue = [[x, y]];
  while(queue.length){
    const [cx, cy] = queue.shift();
    const c = grid[idx(cx, cy)];
    if(c.revealed || c.flagged || c.mine) continue;
    c.revealed = true; revealedCount++;
    order.push([cx, cy]);
    if(c.adj === 0) for(const [nx, ny] of neighbors(cx, cy)){
      const n = grid[idx(nx, ny)];
      if(!n.revealed && !n.flagged && !n.mine) queue.push([nx, ny]);
    }
  }
  order.forEach(([cx, cy], i) => {
    const c = grid[idx(cx, cy)];
    c.el.classList.add("revealed", "pop");
    c.el.style.animationDelay = Math.min(i * 7, 400) + "ms";
    if(c.adj > 0){
      c.el.textContent = c.adj;
      c.el.classList.add("n" + c.adj);
    }
  });
  sReveal();
  checkWin();
}

/* ================= 插旗 ================= */
function toggleFlag(x, y){
  if(over) return;
  const cell = grid[idx(x, y)];
  if(cell.revealed) return;
  cell.flagged = !cell.flagged;
  flagCount += cell.flagged ? 1 : -1;
  cell.el.innerHTML = cell.flagged ? '<span class="flag">🚩</span>' : "";
  $("mineCount").textContent = pad3(mines - flagCount);
  cell.flagged ? sFlag() : sUnflag();
}

/* ================= 快开（chord） ================= */
function chord(x, y){
  if(over) return;
  const cell = grid[idx(x, y)];
  if(!cell.revealed || cell.adj === 0) return;
  const ns = neighbors(x, y);
  const flags = ns.filter(([nx, ny]) => grid[idx(nx, ny)].flagged).length;
  if(flags !== cell.adj) return;
  for(const [nx, ny] of ns){
    const n = grid[idx(nx, ny)];
    if(!n.revealed && !n.flagged){
      if(n.mine){ explode(nx, ny); return; }
      reveal(nx, ny);
      if(over) return;
    }
  }
}

/* ================= 结束 ================= */
function explode(bx, by){
  over = true; stopTimer();
  $("faceBtn").textContent = "💀";
  playBoom();
  boardEl.classList.add("shake");
  setTimeout(() => boardEl.classList.remove("shake"), 600);

  let delay = 0;
  for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){
    const c = grid[idx(x, y)];
    if(c.mine && !c.flagged){
      const step = (x === bx && y === by) ? 0 : 150 + Math.floor(Math.random() * 500);
      setTimeout(() => {
        c.el.classList.add("revealed", "mine", "pop");
        c.el.style.animationDelay = "0ms";
        c.el.innerHTML = '<span class="m-emoji">💣</span>';
        if(x === bx && y === by) c.el.classList.add("boom");
        beep(140, .12, "sawtooth", .07);
      }, step);
    }else if(!c.mine && c.flagged){
      setTimeout(() => {
        c.el.innerHTML = '<span class="m-emoji">💣</span><span class="wrong">❌</span>';
      }, 250);
    }
  }
  setTimeout(() => showEnd(false), 1300);
}

function checkWin(){
  if(over) return;
  if(revealedCount === rows * cols - mines) win();
}

function win(){
  over = true; stopTimer();
  $("faceBtn").textContent = "😎";
  playWin();
  // 自动给剩余雷插旗
  let d = 0;
  for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){
    const c = grid[idx(x, y)];
    if(c.mine && !c.flagged){
      setTimeout(() => { c.el.innerHTML = '<span class="flag">🚩</span>'; sFlag(); }, d);
      d += 40;
    }
  }
  $("mineCount").textContent = pad3(0);

  // 记录最佳
  const isRecord = !getBest() || time < getBest();
  if(isRecord) localStorage.setItem(bestKey(), time);
  updateBestLabel();

  setTimeout(() => {
    confetti();
    showEnd(true, isRecord);
  }, Math.min(d, 900) + 250);
}

function showEnd(won, isRecord = false){
  $("mIcon").textContent = won ? "😎" : "💀";
  $("mTitle").textContent = won ? "胜利！" : "被炸飞了…";
  $("mRecord").style.display = isRecord ? "block" : "none";
  $("mInfo").textContent = `用时 ${time} 秒 · ${diffLabel()} · ${mines} 雷`;
  $("mBest").textContent = "本机最佳：" + (getBest() ? getBest() + " 秒" : "--");
  $("overlay").classList.add("show");
}

/* ================= 彩带 ================= */
function confetti(){
  const colors = ["#ff6b6b", "#ffb648", "#4d8dff", "#34c77b", "#b47aff", "#3fd6d6"];
  for(let i = 0; i < 70; i++){
    const s = document.createElement("span");
    s.className = "confetti";
    s.style.left = Math.random() * 100 + "vw";
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.width = 6 + Math.random() * 7 + "px";
    s.style.height = 9 + Math.random() * 8 + "px";
    s.style.animationDuration = 2.2 + Math.random() * 2 + "s";
    s.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5200);
  }
}

/* ================= 事件绑定 ================= */
boardEl.addEventListener("contextmenu", e => {
  const t = e.target.closest(".cell");
  if(!t) return;
  e.preventDefault();
  toggleFlag(+t.dataset.x, +t.dataset.y);
});

boardEl.addEventListener("mousedown", e => {
  ensureAudio();
  if(e.button === 1){ // 中键快开
    e.preventDefault();
    const t = e.target.closest(".cell");
    if(t) chord(+t.dataset.x, +t.dataset.y);
    return;
  }
  if(e.button === 0 && !over){ pressing = true; $("faceBtn").textContent = "😮"; }
});
document.addEventListener("mouseup", () => {
  if(pressing){ pressing = false; if(!over) $("faceBtn").textContent = "🙂"; }
});

boardEl.addEventListener("click", e => {
  ensureAudio();
  if(suppressClick){ suppressClick = false; return; }
  const t = e.target.closest(".cell");
  if(!t) return;
  const x = +t.dataset.x, y = +t.dataset.y;
  const c = grid[idx(x, y)];
  if(flagMode){ toggleFlag(x, y); return; }
  if(c.revealed) chord(x, y);
  else reveal(x, y);
});

boardEl.addEventListener("dblclick", e => {
  const t = e.target.closest(".cell");
  if(t) chord(+t.dataset.x, +t.dataset.y);
});

/* 触屏：长按插旗；短按走 click */
let lpTimer = null, touchStartPos = null;
boardEl.addEventListener("touchstart", e => {
  ensureAudio();
  const t = e.target.closest(".cell");
  if(!t) return;
  touchStartPos = [e.touches[0].clientX, e.touches[0].clientY];
  lpTimer = setTimeout(() => {
    lpTimer = null;
    suppressClick = true;
    toggleFlag(+t.dataset.x, +t.dataset.y);
    navigator.vibrate && navigator.vibrate(30);
  }, 320);
}, { passive: true });
boardEl.addEventListener("touchmove", e => {
  if(!lpTimer || !touchStartPos) return;
  const dx = e.touches[0].clientX - touchStartPos[0];
  const dy = e.touches[0].clientY - touchStartPos[1];
  if(dx * dx + dy * dy > 100){ clearTimeout(lpTimer); lpTimer = null; } // 滑动取消
}, { passive: true });
boardEl.addEventListener("touchend", () => {
  if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
});

$("faceBtn").addEventListener("click", () => restart());
$("mRestart").addEventListener("click", () => restart());
$("mClose").addEventListener("click", () => $("overlay").classList.remove("show"));
document.addEventListener("keydown", e => {
  if(e.key === "r" || e.key === "R"){ if(document.activeElement.tagName !== "INPUT") restart(); }
  if(e.key === "Escape") $("overlay").classList.remove("show");
});

function restart(){ newGame(rows, cols, mines); }

/* 难度切换 */
$("diffPills").addEventListener("click", e => {
  const btn = e.target.closest(".pill");
  if(!btn) return;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  curDiff = btn.dataset.diff;
  $("customPanel").classList.toggle("show", curDiff === "custom");
  if(curDiff !== "custom"){
    const d = DIFFS[curDiff];
    newGame(d.rows, d.cols, d.mines);
  }
});

$("applyCustom").addEventListener("click", () => {
  let r = Math.min(24, Math.max(5, +$("cRows").value || 9));
  let c = Math.min(30, Math.max(5, +$("cCols").value || 9));
  let m = Math.min(r * c - 10, Math.max(1, +$("cMines").value || 10));
  $("cRows").value = r; $("cCols").value = c; $("cMines").value = m;
  newGame(r, c, m);
});

/* 插旗模式 */
$("flagModeBtn").addEventListener("click", function(){
  flagMode = !flagMode;
  this.classList.toggle("active", flagMode);
  this.title = flagMode ? "当前：点击 = 插旗" : "当前：点击 = 翻开";
});

/* 音效开关 */
$("soundBtn").addEventListener("click", function(){
  soundOn = !soundOn;
  localStorage.setItem("ms.sound", soundOn);
  this.textContent = soundOn ? "🔊" : "🔇";
  ensureAudio();
  if(soundOn) sFlag();
});

/* 主题切换 */
$("themeBtn").addEventListener("click", function(){
  const cur = document.body.dataset.theme;
  const next = cur === "dark" ? "light" : "dark";
  document.body.dataset.theme = next;
  localStorage.setItem("ms.theme", next);
  this.textContent = next === "dark" ? "🌙" : "☀️";
});

/* 窗口缩放时只重算格子尺寸，保留当前棋局 */
function fitBoardSize(){
  const avail = Math.min($("boardWrap").clientWidth - 26, window.innerWidth - 44);
  const cell = Math.max(20, Math.min(38, Math.floor((avail - 3 * (cols - 1)) / cols)));
  boardEl.style.setProperty("--cols", cols);
  boardEl.style.setProperty("--cell", cell + "px");
  boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell))`;
}
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fitBoardSize, 150);
});

/* ================= 初始化 ================= */
(function init(){
  document.body.dataset.theme = localStorage.getItem("ms.theme") || "dark";
  $("themeBtn").textContent = document.body.dataset.theme === "dark" ? "🌙" : "☀️";
  $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
  newGame(9, 9, 10);
})();
</script>
</body>
